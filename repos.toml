# The repos to index. Each repo must be cloned into data/repos/<name>.
#
# exclude: path prefixes (inside the repo) that are skipped.
# owners:  files whose name matches a glob get that owner instead of "me".
#          The owner shows up in the chunk data, so answers can say when a file
#          was written by a teammate.

[[repos]]
name = "credit_risk_ML_model"
exclude = ["images/", "models/", "data/"]

[[repos]]
name = "synergyhack"
exclude = ["scripts/fixtures/", "server/src/data/"]

[[repos]]
name = "timeout-airline"
# bin/ is build output, docs/ is generated Javadoc
exclude = ["bin/", "docs/", ".mvn/"]
# Git history: my teammate Hetvi has one commit ("added plane, airport,flight code",
# 2025-12-15) that adds the three model files below. Every service, controller,
# repository and DTO for Plane, Airport and Flight was committed by me, so only
# these three files are tagged as hers. Full paths, because the rule has a slash.
[[repos.owners]]
glob = "src/main/java/fr/epita/timeoutairline/model/Plane.java"
owner = "Hetvi (teammate)"
[[repos.owners]]
glob = "src/main/java/fr/epita/timeoutairline/model/Airport.java"
owner = "Hetvi (teammate)"
[[repos.owners]]
glob = "src/main/java/fr/epita/timeoutairline/model/Flight.java"
owner = "Hetvi (teammate)"

[[repos]]
name = "GameHub"
# modules/ holds the course exercises, not my own code.
exclude = ["modules/"]
# GameHub is a fork of a course template. Git history shows 39 commits by the
# course author and 3 by me (the user-service implementation plus two merges).
# So everything is tagged "course template" unless a rule below says it is mine.
default_owner = "course template"
[[repos.owners]]
glob = "services/user-service/*"
owner = "me"

[[repos]]
name = "fracton-scanner"
# data/ holds scan results about real people. Never index it.
exclude = ["data/"]
