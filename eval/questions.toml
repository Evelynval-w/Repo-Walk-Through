# Evaluation questions for Repo-Walk-Through (phase 3).
#
# How to read an entry:
#   id              short name, used in reports
#   repo            which repo the question is about
#   kind            what sort of question it is (fact, how, why, numbers, list)
#   question        what gets asked, word for word
#   expected_files  ANY ONE of these files holding the answer counts as a retrieval hit.
#                   Written as repo/path. Several files are listed when the README
#                   or a doc says the same thing as the code.
#   must_say        the short facts a correct answer has to contain (the judge checks these)
#   answerable      false means the answer is NOT in the code and the bot should say so
#   note            why the question is here, or what to check
#
# Gold fixes after the first baseline (2026-11-05): cr-01 (dropped a fact that belongs to another
# question), ta-05 (code never says the discount code is optional), fs-01 (vague fact),
# gh-06 (path segment wording), gh-01 (dropped an implicit fact).
# Status: DRAFT. Every gold answer was read from the real files, but you check them.
# Change anything you would not say yourself. Delete questions you could not defend.
# The last 12 entries are yours (6 harder answerable ones) and 6 unanswerable ones whose
# topics were checked by grep to be absent from the repos.

# ---------------------------------------------------------------------------
# credit_risk_ML_model
# ---------------------------------------------------------------------------

[[questions]]
id = "cr-01"
repo = "credit_risk_ML_model"
kind = "fact"
question = "How is a loan marked as a default in the target column?"
expected_files = [
  "credit_risk_ML_model/notebooks/01_data_cleaning.ipynb",
  "credit_risk_ML_model/README.md",
]
must_say = [
  "Charged Off, Default and the late statuses (16-30 and 31-120 days) count as default",
]
answerable = true
note = "Cells 11 and 12 of notebook 01."

[[questions]]
id = "cr-02"
repo = "credit_risk_ML_model"
kind = "why"
question = "Why is missing-value imputation not done in the data cleaning notebook?"
expected_files = [
  "credit_risk_ML_model/notebooks/01_data_cleaning.ipynb",
  "credit_risk_ML_model/notebooks/03_feature_engineering.ipynb",
]
must_say = [
  "the imputer (median, mean, scaler) must be fit on the training split only",
  "fitting it before the split leaks test information into training",
]
answerable = true
note = "Cell 19 of notebook 01. Notebook 03 does the split first, then fits."

[[questions]]
id = "cr-03"
repo = "credit_risk_ML_model"
kind = "why"
question = "Why does the modeling notebook not rely on accuracy, and which metric is the main one?"
expected_files = [
  "credit_risk_ML_model/notebooks/04_modeling.ipynb",
  "credit_risk_ML_model/README.md",
]
must_say = [
  "about 80 percent of loans are fully paid, so always predicting paid already gets 80 percent accuracy",
  "PR-AUC is the primary metric",
]
answerable = true
note = "Cell 5 of notebook 04."

[[questions]]
id = "cr-04"
repo = "credit_risk_ML_model"
kind = "list"
question = "Which models are compared in the modeling notebook, and which one is the champion?"
expected_files = [
  "credit_risk_ML_model/notebooks/04_modeling.ipynb",
  "credit_risk_ML_model/README.md",
]
must_say = [
  "a majority-class baseline, logistic regression variants, a random forest and XGBoost",
  "XGBoost is the champion",
]
answerable = true
note = "Cell 1 and the later sections of notebook 04. Check the README agrees."

[[questions]]
id = "cr-05"
repo = "credit_risk_ML_model"
kind = "numbers"
question = "At the best decision threshold, how many applications does the model approve and how much more profit does it make than approving everyone?"
expected_files = [
  "credit_risk_ML_model/notebooks/05_business_metrics.ipynb",
  "credit_risk_ML_model/README.md",
]
must_say = [
  "threshold 0.58",
  "approves 95.5 percent of applications",
  "about 1.76 million dollars (13 percent) more than approving everyone",
]
answerable = true
note = "Cell 22 of notebook 05. These numbers come from your own notebook text."

# ---------------------------------------------------------------------------
# synergyhack
# ---------------------------------------------------------------------------

[[questions]]
id = "sh-01"
repo = "synergyhack"
kind = "fact"
question = "How are passwords stored and how long does a login token last?"
expected_files = [
  "synergyhack/server/src/services/auth.service.js",
  "synergyhack/README.md",
]
must_say = [
  "passwords are hashed with bcrypt using 10 salt rounds",
  "tokens are JWTs that expire after 24 hours by default (JWT_EXPIRES_IN)",
]
answerable = true
note = "auth.service.js: SALT_ROUNDS = 10, getExpiresIn() defaults to 24h."

[[questions]]
id = "sh-02"
repo = "synergyhack"
kind = "how"
question = "How does the team match algorithm score a candidate?"
expected_files = [
  "synergyhack/server/src/services/match.service.js",
  "synergyhack/docs/neo4j-schema.md",
  "synergyhack/README.md",
]
must_say = [
  "it runs in Neo4j and only counts candidate skills the team does not already have",
  "it sums the COMPLEMENTS strengths from those skills to the team's skills",
  "candidates with a score of zero are dropped and the top N (20 by default) are returned",
]
answerable = true
note = "findMatches in match.service.js."

[[questions]]
id = "sh-03"
repo = "synergyhack"
kind = "how"
question = "How does the OAuth login protect against forged callbacks?"
expected_files = [
  "synergyhack/server/src/services/oauth.service.js",
]
must_say = [
  "a random state value is saved in Redis and expires after 10 minutes",
  "the state is deleted when it is used, so it works only once",
]
answerable = true
note = "createState and consumeState, STATE_TTL = 600."

[[questions]]
id = "sh-04"
repo = "synergyhack"
kind = "list"
question = "Which databases does synergyhack use and what is each one used for?"
expected_files = [
  "synergyhack/README.md",
  "synergyhack/docs/architecture.md",
]
must_say = [
  "MongoDB for profiles, teams, events and other documents",
  "Neo4j for the skill graph and the matching",
  "Redis for sessions and chat streams",
]
answerable = true
note = "Aggregate question: the answer is spread over several chunks, so top-k may hurt."

[[questions]]
id = "sh-05"
repo = "synergyhack"
kind = "how"
question = "How is a user kept in sync between MongoDB and Neo4j?"
expected_files = [
  "synergyhack/server/src/services/graph-sync.service.js",
  "synergyhack/README.md",
]
must_say = [
  "graph-sync.service is the single place that touches both databases",
  "it uses MERGE, so operations can be repeated safely",
]
answerable = true
note = "Header comment and syncUser in graph-sync.service.js."

