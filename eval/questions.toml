[[questions]]
id = "fs-01"
repo = "fracton-scanner"
kind = "numbers"
question = "How is the fit score of a streamer computed and what are its parts?"
expected_files = [
  "fracton-scanner/streamer_finder_v3.py",
]
must_say = [
  "the score is the rounded sum of five parts and is at most 100",
  "engagement up to 30, consistency 20, giveaway and brand signal 20, location 15, audience size 15",
]
answerable = true
note = "fit_score."

[[questions]]
id = "fs-02"
repo = "fracton-scanner"
kind = "how"
question = "How does the Twitch client handle rate limits and failed requests?"
expected_files = [
  "fracton-scanner/streamer_finder_v3.py",
]
must_say = [
  "it retries up to 8 times",
  "on 429 or a 5xx error it waits until the rate limit reset time",
  "on 401 it refreshes the token",
]
answerable = true
note = "Twitch.get."

[[questions]]
id = "fs-03"
repo = "fracton-scanner"
kind = "why"
question = "Why does the scanner use an app access token instead of user OAuth?"
expected_files = [
  "fracton-scanner/README.md",
]
must_say = [
  "follower totals can be read with a client-credentials token",
  "so the scheduled job needs no browser login and no refresh token in CI secrets",
]
answerable = true
note = "README, design decisions."

[[questions]]
id = "fs-04"
repo = "fracton-scanner"
kind = "how"
question = "How does the scanner decide where a streamer is located, and how reliable is that?"
expected_files = [
  "fracton-scanner/streamer_finder_v3.py",
  "fracton-scanner/README.md",
]
must_say = [
  "location is inferred because Twitch publishes no country",
  "profile text gives high confidence, timezone mentions medium, streaming hours alone only a low-confidence guess",
]
answerable = true
note = "guess_region and the README."

[[questions]]
id = "fs-05"
repo = "fracton-scanner"
kind = "how"
question = "How does the scanner deal with 24/7 rerun channels, and why?"
expected_files = [
  "fracton-scanner/README.md",
  "fracton-scanner/streamer_finder_v3.py",
]
must_say = [
  "they are detected by name patterns, title patterns and average stream length",
  "they are excluded with the reason recorded, because they would dominate engagement rankings",
]
answerable = true
note = "README: 'Excluding the easy wins'."

